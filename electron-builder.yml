appId: se.jonasolson.notera
productName: Notera
copyright: Copyright © 2026 Jonas Olson
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - dist/**/*
  - fonts/**/*
  # Window icon: without it Windows takes the icon from the exe via its icon cache, which goes blank after an update.
  - build/icon.ico
  - build/icon.png
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
  fileAssociations:
    - ext: md
      name: Markdown
      description: Markdown document
      role: Editor
    - ext: markdown
      name: Markdown
      description: Markdown document
      role: Editor
    - ext: txt
      name: Text
      description: Text document
      role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Notera
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.exe
# Auto-update feed: the installed app reads latest.yml from this repo's GitHub Releases.
# Every release must upload Notera-Setup-<version>.exe, its .blockmap and latest.yml.
publish:
  provider: github
  owner: KaptenKatthatt
  repo: notera
  releaseType: release
