# Builds the Windows installer on GitHub's own Windows runner and publishes it as the GitHub
# release for the version in package.json (tag v<version>), with the three files installed copies
# need to update themselves: Notera-Setup-<version>.exe, its .blockmap and latest.yml, plus the
# portable exe. Started by hand (Actions > Release > Run workflow) after the "Release v<version>"
# commit is on master. The notes become the release text.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs --prod
      - name: Tag v<version> and create its release (a published release needs its tag first)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "$tag exists"; else git tag "$tag" && git push origin "$tag"; fi
          # The release exists before electron-builder uploads to it. Left to itself, electron-builder
          # creates it once per target (nsis, portable) at the same moment, and two releases with one
          # tag break the update feed: the tag's download links lead to the one without latest.yml (0.16.0).
          if gh release view "$tag" >/dev/null 2>&1; then echo "release $tag exists"; else gh release create "$tag" --verify-tag --title "${tag#v}" --notes "$NOTES"; fi
      - name: Build and publish the installer
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/verify-package.mjs
      - name: Release notes
        if: ${{ inputs.notes != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release edit "v$(node -p "require('./package.json').version")" --notes-file "$RUNNER_TEMP/notes.md"
