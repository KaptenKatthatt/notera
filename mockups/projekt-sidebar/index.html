<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notera, mockup: projekt i sidopanelen</title>
<style>
:root {
  --bg: #ffffff; --bg-chrome: #f4f4f3; --bg-hover: #e8e8e8; --bg-active: #ffffff; --bg-popup: #ffffff;
  --fg: #222324; --fg-muted: #6b6b6b; --border: #dcdcdc; --accent: #0067c0; --accent-fg: #ffffff;
  --selection: #cce4ff; --shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
  --sel-row: rgba(0, 103, 192, 0.12); --danger: #b3261e; --flash: #fff1a8;
  --ui-font: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --editor-font: "iA Writer Mono S", Consolas, "Cascadia Mono", Menlo, "Courier New", monospace;
  --md-h: #222324; --md-meta: #aeb1b5;
  --mk-bg: #fff6d1; --mk-border: #d9c27a; --mk-fg: #5a4a10; --mk-btn: #fffbea;
  --sbw: 264px; --mockbar: 42px;
}
html[data-theme="dark"] {
  --bg: #101010; --bg-chrome: #1c1c1c; --bg-hover: #2c2c2c; --bg-active: #101010; --bg-popup: #232323;
  --fg: #eeeeee; --fg-muted: #a0a0a0; --border: #333333; --accent: #4cc2ff; --accent-fg: #002b45;
  --selection: #2a4a6b; --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  --sel-row: rgba(76, 194, 255, 0.16); --danger: #ff8a80; --flash: #5a4a10;
  --md-h: #eeeeee; --md-meta: #6d7078;
  --mk-bg: #2e2913; --mk-border: #5e5222; --mk-fg: #e8d78f; --mk-btn: #3a3418;
}
html[data-theme="dark"] { color-scheme: dark; }
@font-face { font-family: "iA Writer Mono S"; src: url("../../fonts/iAWriterMonoS-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "iA Writer Mono S"; src: url("../../fonts/iAWriterMonoS-Bold.ttf"); font-weight: 700; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--ui-font); font-size: 13px; color: var(--fg); background: var(--bg); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
svg { flex: none; }

/* ---------- Mockup bar (not part of the app) ---------- */
#mockbar {
  height: var(--mockbar); display: flex; align-items: center; gap: 6px; padding: 0 8px;
  background: var(--mk-bg); border-bottom: 1px dashed var(--mk-border); color: var(--mk-fg);
  overflow-x: auto; white-space: nowrap; scrollbar-width: none;
}
#mockbar::-webkit-scrollbar { display: none; }
#mockbar .lbl { font-size: 11px; font-weight: 600; letter-spacing: .02em; margin-right: 2px; }
.mk-btn {
  border: 1px solid var(--mk-border); background: var(--mk-btn); color: var(--mk-fg); border-radius: 6px;
  padding: 5px 9px; font: 12px ui-monospace, Consolas, Menlo, monospace; flex: none;
}
.mk-btn:active { transform: translateY(1px); }
.mk-btn.on { background: var(--mk-fg); color: var(--mk-bg); }

/* ---------- Stage / frame ---------- */
#stage { position: relative; height: calc(100dvh - var(--mockbar)); overflow: hidden; }
body.desktop #stage { background: #7a7a7a; overflow: auto; }
#frame { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
body.desktop #frame { width: 1280px; transform-origin: 0 0; box-shadow: 0 10px 40px rgba(0,0,0,.4); }

/* ---------- Native menu bar (Electron) ---------- */
#menubar { display: flex; align-items: center; height: 26px; padding: 0 4px; background: var(--bg-chrome); flex: none; }
#menubar button { border: none; background: transparent; padding: 3px 9px; border-radius: 4px; font-size: 12px; }
#menubar button:hover, #menubar button.open { background: var(--bg-hover); }
#menubar .app-title { margin-left: auto; color: var(--fg-muted); font-size: 12px; padding-right: 8px; }

#appbody { flex: 1; display: flex; min-height: 0; position: relative; }

/* ---------- Sidebar ---------- */
#sidebar {
  width: var(--sbw); flex: none; overflow: hidden; background: var(--bg-chrome);
  border-right: 1px solid var(--border); transition: width .18s ease; position: relative; z-index: 6;
}
body.sb-closed #sidebar { width: 0; border-right: none; }
.sb-inner { width: var(--sbw); height: 100%; display: flex; flex-direction: column; }
.sb-top { padding: 8px 8px 6px; display: flex; flex-direction: column; gap: 8px; }
.sb-title { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px; font-weight: 600; }
.sb-title .spacer { flex: 1; }
.sb-search {
  display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg-muted);
}
.sb-search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--fg); font: inherit; }
.sb-search:focus-within { border-color: var(--accent); }
kbd { font: 10px ui-monospace, Consolas, Menlo, monospace; color: var(--fg-muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; background: var(--bg-chrome); white-space: nowrap; }
body.touch .sb-search kbd { display: none; }
#sb-list { flex: 1; overflow-y: auto; padding: 2px 0 12px; scrollbar-width: thin; overscroll-behavior: contain; }
.sb-foot { border-top: 1px solid var(--border); padding: 6px; }
.sb-foot button { width: 100%; display: flex; align-items: center; gap: 8px; border: none; background: transparent; border-radius: 6px; height: 32px; padding: 0 8px; color: var(--fg-muted); }
.sb-foot button:hover, .sb-foot button.on { background: var(--bg-hover); color: var(--fg); }
.sb-foot .count { margin-left: auto; font-size: 11px; }

.sec { display: flex; align-items: center; height: 28px; margin: 10px 6px 2px; padding: 0 4px 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-muted); }
.sec .spacer { flex: 1; }
.row {
  display: flex; align-items: center; gap: 6px; height: 30px; margin: 1px 6px; padding: 0 4px 0 6px;
  border-radius: 6px; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; cursor: default;
}
body.touch .row { height: 40px; }
.row:hover { background: var(--bg-hover); }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .muted, .row .count { color: var(--fg-muted); font-size: 11px; }
.row.note { padding-left: 28px; }
.row.note .pin { color: var(--fg-muted); margin-left: -18px; margin-right: 0; }
.row.active { background: var(--sel-row); }
.row.active .name { font-weight: 600; }
.row.untitled .name { color: var(--fg-muted); font-style: italic; }
.row .chev { width: 16px; height: 16px; color: var(--fg-muted); transition: transform .12s; }
.row .chev.open { transform: rotate(90deg); }
.row .ico { color: var(--fg-muted); }
.acts { display: flex; gap: 1px; opacity: 0; }
.row:hover .acts, .row.menu-open .acts, body.touch .acts { opacity: 1; }
.acts button, .ibtn {
  width: 24px; height: 24px; border: none; background: transparent; border-radius: 4px; color: var(--fg-muted);
  display: grid; place-items: center; padding: 0;
}
body.touch .acts button { width: 34px; height: 34px; }
.acts button:hover, .ibtn:hover { background: var(--bg-active); color: var(--fg); }
html[data-theme="dark"] .acts button:hover, html[data-theme="dark"] .ibtn:hover { background: #3a3a3a; }
.hint { margin: 2px 6px 4px 34px; font-size: 12px; color: var(--fg-muted); padding: 4px 0; }
.hint.drop { border-radius: 6px; padding: 6px; margin-left: 28px; }
.row.newproj { color: var(--fg-muted); }
.row.newproj input, .row input.rename {
  flex: 1; min-width: 0; height: 24px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px;
  background: var(--bg); color: var(--fg); font: inherit; outline: none;
}
body.touch .row input { height: 32px; font-size: 16px; }
.err { margin: 0 8px 4px 34px; color: var(--danger); font-size: 12px; }
.row.dragging { opacity: .35; }
.drop-before::before, .drop-after::after {
  content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--accent); border-radius: 2px; pointer-events: none;
}
.drop-before::before { top: -2px; }
.drop-after::after { bottom: -2px; }
.drop-into { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--sel-row); }
.row.flash, .flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--flash); } 100% { background: transparent; } }

.arch-head { display: flex; align-items: center; gap: 6px; margin: 4px 6px 6px; padding: 0 4px; height: 30px; font-weight: 600; }
.arch-note { margin: 0 12px 6px; font-size: 12px; color: var(--fg-muted); }
.tag { font-size: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 1px 6px; color: var(--fg-muted); white-space: nowrap; }

.res { margin: 1px 6px; padding: 6px 8px; border-radius: 6px; cursor: default; }
.res:hover, .res.sel { background: var(--bg-hover); }
.res .t { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.res .t span.tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .s { font-size: 12px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.res .p { font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
mark { background: var(--flash); color: inherit; border-radius: 2px; }
.empty-res { margin: 16px 14px; color: var(--fg-muted); }

.setup { margin: 16px 12px; padding: 14px; border: 1px dashed var(--border); border-radius: 8px; color: var(--fg-muted); line-height: 1.5; }
.setup b { color: var(--fg); }

#resizer { width: 6px; margin-left: -3px; cursor: col-resize; position: relative; z-index: 7; flex: none; touch-action: none; }
#resizer:hover, #resizer.on { background: var(--accent); opacity: .4; }
body.sb-closed #resizer, body.narrow #resizer { display: none; }
#scrim { display: none; }

/* ---------- Workspace ---------- */
#workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#tabbar { display: flex; align-items: flex-end; background: var(--bg-chrome); padding: 6px 6px 0 6px; gap: 2px; min-height: 38px; flex: none; }
#sb-toggle { margin-right: 4px; }
.icon-btn { border: none; background: transparent; border-radius: 6px; width: 30px; height: 30px; margin-bottom: 2px; color: var(--fg-muted); display: grid; place-items: center; padding: 0; flex: none; }
.icon-btn:hover, .icon-btn.on { background: var(--bg-hover); color: var(--fg); }
#tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 6px; padding: 7px 6px 7px 12px; border-radius: 8px 8px 0 0;
  border: 1px solid transparent; border-bottom: none; color: var(--fg-muted); white-space: nowrap; max-width: 220px; flex: none; cursor: default;
}
.tab:hover { background: var(--bg-hover); color: var(--fg); }
.tab.active { background: var(--bg-active); color: var(--fg); border-color: var(--border); }
.tab .name { overflow: hidden; text-overflow: ellipsis; }
.tab .kind { font-size: 10px; color: var(--fg-muted); }
.tab .close, .tab .more { border: none; background: transparent; width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; color: var(--fg-muted); padding: 0; }
.tab .close:hover, .tab .more:hover { background: var(--bg-hover); color: var(--fg); }

#toolbar { display: flex; align-items: center; gap: 2px; padding: 4px 8px; border-bottom: 1px solid var(--border); min-height: 38px; flex: none; overflow: hidden; }
.tb-btn { border: 1px solid transparent; background: transparent; border-radius: 6px; min-width: 30px; height: 30px; padding: 0 7px; font-size: 14px; color: var(--fg); }
.tb-btn:hover { background: var(--bg-hover); }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex: none; }
.segmented { margin-left: auto; display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex: none; }
.segmented button { border: none; background: transparent; padding: 4px 10px; color: var(--fg-muted); }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button.active { background: var(--accent); color: var(--accent-fg); }

.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--bg-chrome); font-size: 13px; }
.banner .grow { flex: 1; min-width: 180px; }
.btn { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 5px 12px; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
html[data-theme="dark"] .btn.danger { color: #2b0000; }
body.touch .btn { padding: 9px 14px; }

#main { flex: 1; position: relative; min-height: 0; }
#hl, #ta {
  position: absolute; inset: 0; margin: 0; border: 0; padding: 16px 22px 60px;
  font-family: var(--editor-font); font-size: 15px; line-height: 1.65; letter-spacing: 0; tab-size: 4;
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; overflow-y: auto;
  scrollbar-width: none; font-variant-ligatures: none;
}
#hl::-webkit-scrollbar, #ta::-webkit-scrollbar { display: none; }
body.touch #hl, body.touch #ta { font-size: 16px; padding: 14px 16px 60px; }
#hl { color: var(--fg); pointer-events: none; overflow: hidden; }
#ta { background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--fg); resize: none; outline: none; }
#ta::selection { background: var(--selection); }
#hl .mk { color: var(--md-meta); }
#hl .h { color: var(--md-h); font-weight: 700; }
#hl .meta { color: var(--md-meta); }
#hl .ph { color: var(--md-meta); font-weight: 400; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-muted); text-align: center; padding: 20px; }
#empty .box { display: flex; flex-direction: column; gap: 10px; align-items: center; }

#statusbar { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 26px; background: var(--bg-chrome); border-top: 1px solid var(--border); color: var(--fg-muted); font-size: 12px; flex: none; white-space: nowrap; overflow: hidden; }
#statusbar > span, #statusbar > button { padding: 0 8px; }
#statusbar .st-btn { border: none; background: transparent; height: 22px; border-radius: 4px; color: inherit; }
#statusbar .st-btn:hover { background: var(--bg-hover); color: var(--fg); }
#st-path { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#st-path.flash { border-radius: 4px; }
#statusbar .spacer { flex: 1; }

/* ---------- Disk panel ---------- */
#disk { width: 0; flex: none; overflow: hidden; background: var(--bg-chrome); border-left: 1px solid var(--border); transition: width .18s; }
body.disk-open #disk { width: 330px; }
body:not(.disk-open) #disk { border-left: none; }
.disk-inner { width: 330px; height: 100%; display: flex; flex-direction: column; }
.disk-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 600; }
.disk-head .spacer { flex: 1; }
.disk-body { flex: 1; overflow: auto; padding: 8px 10px 20px; font: 12px/1.7 ui-monospace, Consolas, Menlo, monospace; }
.disk-body .d { white-space: nowrap; padding: 0 4px; border-radius: 3px; }
.disk-body .dir { font-weight: 700; }
.disk-body .muted { color: var(--fg-muted); }
.disk-body h4 { font: 600 11px var(--ui-font); letter-spacing: .04em; text-transform: uppercase; color: var(--fg-muted); margin: 14px 0 4px; }
.disk-body details summary { cursor: pointer; }
.disk-body pre { margin: 4px 0 0 14px; padding: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; line-height: 1.5; overflow-x: auto; }
.disk-note { font: 12px/1.45 var(--ui-font); color: var(--fg-muted); margin: 2px 0 8px; }

/* ---------- Overlays ---------- */
.popup-menu {
  position: absolute; z-index: 40; display: flex; flex-direction: column; min-width: 200px; max-width: 290px; padding: 4px;
  background: var(--bg-popup); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
}
.popup-menu button { display: flex; align-items: center; gap: 10px; border: none; background: transparent; text-align: left; padding: 6px 10px; border-radius: 4px; white-space: nowrap; }
body.touch .popup-menu button { padding: 11px 12px; }
.popup-menu button:hover { background: var(--bg-hover); }
.popup-menu button .lab { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.popup-menu button.danger { color: var(--danger); }
.popup-menu button[disabled] { opacity: .45; }
.popup-menu .sep { height: 1px; background: var(--border); margin: 4px 2px; }
.popup-menu .mh { padding: 6px 10px 4px; font-size: 11px; color: var(--fg-muted); }
.popup-menu .chk { width: 14px; text-align: center; }

#toast {
  position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 12px;
  background: #2b2b2b; color: #f2f2f2; border-radius: 8px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow); max-width: calc(100% - 24px);
}
#toast .msg { overflow: hidden; text-overflow: ellipsis; }
#toast button { border: none; background: transparent; color: #7cc8ff; font-weight: 600; padding: 6px 10px; border-radius: 4px; }
#toast button:hover { background: #3a3a3a; }
#toast .bar { position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; background: #7cc8ff; transform-origin: 0 50%; opacity: .6; }

.modal-back { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; }
.modal { width: min(440px, 100%); background: var(--bg-popup); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 18px 20px 16px; max-height: 100%; overflow: auto; }
.modal h2 { font-size: 16px; margin: 0 0 10px; }
.modal p { margin: 0 0 10px; line-height: 1.5; }
.modal .acts2 { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.modal label.chkl { display: flex; align-items: center; gap: 8px; color: var(--fg-muted); }
.modal input[type=text] { width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); padding: 0 8px; font: 12px ui-monospace, Consolas, Menlo, monospace; }
body.touch .modal input[type=text] { font-size: 16px; height: 40px; }
.modal ol { padding-left: 20px; margin: 0; line-height: 1.5; }
.modal ol li { margin-bottom: 6px; }

#palette { position: absolute; inset: 0; z-index: 55; background: rgba(0,0,0,.18); }
.pal { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 20px)); background: var(--bg-popup); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.pal .sb-search { border: none; border-bottom: 1px solid var(--border); border-radius: 0; height: 44px; padding: 0 14px; background: transparent; }
.pal .sb-search input { font-size: 15px; }
body.touch .pal .sb-search input { font-size: 16px; }
.pal .list { max-height: 50vh; overflow: auto; padding: 4px 0; }

#ghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: var(--bg-popup); border: 1px solid var(--accent); box-shadow: var(--shadow); font-size: 13px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#writing-exit { position: absolute; top: 8px; right: 10px; z-index: 5; }
body.writing #menubar, body.writing #tabbar, body.writing #toolbar, body.writing #statusbar, body.writing #sidebar, body.writing #resizer, body.writing .banner { display: none !important; }
body.writing #hl, body.writing #ta { padding-left: max(22px, calc(50% - 360px)); padding-right: max(22px, calc(50% - 360px)); padding-top: 40px; }

/* ---------- Narrow screens: drawer + bottom sheet ---------- */
body.narrow #menubar .app-title { display: none; }
body.narrow #sidebar {
  position: absolute; left: 0; top: 0; bottom: 0; width: min(86vw, 330px); z-index: 30; border-right: 1px solid var(--border);
  transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow);
}
body.narrow.drawer-open #sidebar { transform: none; }
body.narrow .sb-inner { width: 100%; }
body.narrow #scrim { display: block; position: absolute; inset: 0; z-index: 29; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
body.narrow.drawer-open #scrim { opacity: 1; pointer-events: auto; }
body.narrow .segmented, body.narrow .tb-wide { display: none; }
body.narrow #st-extra { display: none; }
body.narrow #disk {
  position: absolute; left: 0; right: 0; bottom: 0; width: auto !important; height: 62%; z-index: 35; border-left: none; border-top: 1px solid var(--border);
  border-radius: 12px 12px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .2s ease;
}
body.narrow.disk-open #disk { transform: none; }
body.narrow .disk-inner { width: 100%; }
body.narrow .tab { max-width: 160px; }
</style>
</head>
<body>
<div id="mockbar" aria-label="Mockup-verktyg (inte en del av appen)">
  <span class="lbl">MOCKUP</span>
  <button class="mk-btn" data-mk="ctrl-t" title="Ny anteckning i Osorterat">Ctrl+T</button>
  <button class="mk-btn" data-mk="ctrl-alt-n" title="Ny anteckning i aktuellt projekt">Ctrl+Alt+N</button>
  <button class="mk-btn" data-mk="ctrl-shift-b" title="Fäll ut eller in sidopanelen">Ctrl+Shift+B</button>
  <button class="mk-btn" data-mk="ctrl-shift-f" title="Sök anteckningar">Ctrl+Shift+F</button>
  <button class="mk-btn" data-mk="disk" id="mk-disk">Disk</button>

const STORE = 'notera-mockup-projekt-sidebar-v1';
let S, U;
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved && saved.S && saved.U) { S = saved.S; U = saved.U; }
} catch { /* start fresh */ }
if (!S) { S = seedDemo(); U = uiDemo(); }
U.writing = false; U.archiveView = false;
function persist() { try { localStorage.setItem(STORE, JSON.stringify({ S, U })); } catch { /* ignore */ } }

// ---------------------------------------------------------------------------
// Model helpers
// ---------------------------------------------------------------------------
const proj = (id) => S.projects.find((p) => p.id === id);
const doc = (id) => S.notes.find((n) => n.id === id);
const activeProjects = () => S.projects.filter((p) => !p.inbox && !p.archived);
const isArchived = (n) => n.kind === 'note' && (n.archived || proj(n.project)?.archived);
const pname = (n) => proj(n.project)?.name ?? '?';
function notesOf(pid) {
  const list = S.notes.filter((n) => n.kind === 'note' && n.project === pid && !n.archived);
  return [...list.filter((n) => n.pinned), ...list.filter((n) => !n.pinned)];
}
function titleOf(n) {
  if (n.kind === 'draft') return n.name;
  if (n.kind === 'ext') return n.path.split('\\').pop();
  const m = n.body.split('\n')[0].match(/^#\s+(.*)$/);
  return m ? m[1].trim() : '';
}
const displayTitle = (n) => (n.kind === 'note' ? titleOf(n) || UNTITLED : titleOf(n));
const sanitize = (t) => t.replace(/[<>:"/\\|?*]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80).replace(/[. ]+$/, '');
const folderOf = (n) => (isArchived(n) ? `Arkiv\\${pname(n)}` : pname(n));
const relPath = (n) => (n.kind === 'note' ? `${folderOf(n)}\\${n.file}` : n.kind === 'ext' ? n.path : `%APPDATA%\\Notera\\drafts\\${n.name}.md`);
const wantedBase = (n) => `${n.created.slice(0, 10)} ${sanitize(titleOf(n)) || UNTITLED}`;
function uniqueFile(n, base) {
  const folder = folderOf(n);
  const taken = new Set(S.notes.filter((x) => x.kind === 'note' && x.id !== n.id && folderOf(x) === folder).map((x) => x.file.toLowerCase()));
  let name = `${base}.md`;
  for (let i = 2; taken.has(name.toLowerCase()); i++) name = `${base} (${i}).md`;
  return name;
}
function setMetaProject(n, name) {
  const lines = n.body.split('\n');
  const i = lines.findIndex((l) => META_RE.test(l));
  if (i >= 0) lines[i] = lines[i].replace(/^Projekt: .*?( · Skapad: .*)$/, (_, rest) => `Projekt: ${name}${rest}`);
  else {
    const meta = `Projekt: ${name} · Skapad: ${n.created}`;
    if (/^#\s/.test(lines[0] || '')) lines.splice(1, 0, meta);
    else lines.unshift(`# ${n.kind === 'note' && n.file ? n.file.replace(/\.md$/, '') : 'Namnlös'}`, meta, '');
  }
  n.body = lines.join('\n');
}
// Put note n (already detached or not) at the top of project pid, just after pinned notes.
function placeTop(n, pid) {
  S.notes.splice(S.notes.indexOf(n), 1);
  const siblings = S.notes.filter((x) => x.kind === 'note' && x.project === pid && !x.archived);
  const firstUnpinned = siblings.find((x) => !x.pinned);
  if (n.pinned || !firstUnpinned) {
    const firstAny = siblings[0];
    S.notes.splice(firstAny ? S.notes.indexOf(firstAny) : S.notes.length, 0, n);
  } else S.notes.splice(S.notes.indexOf(firstUnpinned), 0, n);
}
function moveToProject(n, pid, beforeId, after) {
  const p = proj(pid);
  n.project = pid;
  n.archived = false;
  setMetaProject(n, p.name);
  if (beforeId) {
    S.notes.splice(S.notes.indexOf(n), 1);
    const t = doc(beforeId);
    S.notes.splice(S.notes.indexOf(t) + (after ? 1 : 0), 0, n);
  } else placeTop(n, pid);
  n.file = uniqueFile(n, wantedBase(n));
}

// ---------------------------------------------------------------------------
// Undo + toast + flash
// ---------------------------------------------------------------------------
let toastTimer = null;
const flashPaths = new Set();
function flash(...paths) {
  paths.forEach((p) => flashPaths.add(p));
  setTimeout(() => { paths.forEach((p) => flashPaths.delete(p)); }, 1700);
}
function toast(msg, undo) {
  const t = $('#toast');
  clearTimeout(toastTimer);
  t.innerHTML = `<span class="msg">${esc(msg)}</span>${undo ? '<button id="t-undo">Ångra</button>' : ''}<span class="bar"></span>`;
  t.hidden = false;
  const bar = t.querySelector('.bar');
  bar.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: undo ? 6000 : 3000, easing: 'linear' });
  if (undo) t.querySelector('#t-undo').onclick = () => { undo(); hideToast(); };
  toastTimer = setTimeout(hideToast, undo ? 6000 : 3000);
}
function hideToast() { $('#toast').hidden = true; }
function withUndo(msg, fn) {
  const snap = JSON.stringify(S);
  const res = fn();
  commit();
  toast(msg, () => { S = JSON.parse(snap); commit(); toast('Ångrat'); });
  return res;
}
function commit() {
  U.tabs = U.tabs.filter((id) => doc(id));
  if (!doc(U.active)) U.active = U.tabs[U.tabs.length - 1] || null;
  persist();
  renderAll();
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
const narrow = () => document.body.classList.contains('narrow');
function openDoc(id, { focus = false } = {}) {
  if (!U.tabs.includes(id)) U.tabs.push(id);
  U.active = id;
  if (narrow()) U.drawerOpen = false;
  commit();
  if (focus) focusEditor();
  requestAnimationFrame(() => document.querySelector(`.tab[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' }));
}
function newDraft() {
  const n = { id: newId('d'), kind: 'draft', name: `Namnlös ${S.draftNo++}`, body: '' };
  S.notes.push(n);
  openDoc(n.id, { focus: true });
}
function newNote(pid) {
  if (!S.rootChosen) return newDraft();
  const p = proj(pid);
  const created = fmtDT(new Date());
  const n = { id: newId('n'), kind: 'note', project: pid, created, pinned: false, archived: false,
    body: `# \nProjekt: ${p.name} · Skapad: ${created}\n\n`, file: '' };
  S.notes.push(n);
  placeTop(n, pid);
  n.file = uniqueFile(n, wantedBase(n));
  p.expanded = true;
  flash(relPath(n));
  openDoc(n.id);
  focusEditor(2);
  toast(`Ny anteckning i ${p.name}: ${n.file}`);
}
function currentProjectId() {
  const n = doc(U.active);
  if (n && n.kind === 'note' && !isArchived(n)) return n.project;
  return INBOX;
}
function togglePin(n) {
  n.pinned = !n.pinned;
  if (n.pinned) placeTop(n, n.project);
  commit();
}
function archiveNote(n) {
  withUndo(`Arkiverad: ${displayTitle(n)}`, () => {
    n.archived = true;
    n.file = uniqueFile(n, n.file.replace(/\.md$/, '').replace(/ \(\d+\)$/, ''));
    flash(relPath(n));
  });
}
function trashNote(n) {
  S.trash.unshift(`${ROOT}\\${relPath(n)}`);
  S.notes.splice(S.notes.indexOf(n), 1);
  flash('trash');
}
function deleteNote(n, forever) {
  const run = () => withUndo(`Flyttad till papperskorgen: ${displayTitle(n)}`, () => trashNote(n));
  if (S.dontAskDelete) return run();
  modal({
    title: forever ? 'Ta bort från arkivet?' : 'Ta bort anteckningen?',
    body: `<p>”${esc(displayTitle(n))}” flyttas till papperskorgen i Windows. Därifrån går den att återställa.</p><label class="chkl"><input type="checkbox" id="m-dont"> Fråga inte igen</label>`,
    buttons: [
      { label: 'Avbryt' },
      { label: 'Ta bort', cls: 'danger', act: (root) => { if (root.querySelector('#m-dont').checked) S.dontAskDelete = true; run(); } },
    ],
  });
}
function archiveProject(p) {
  withUndo(`Projektet ${p.name} arkiverat`, () => {
    p.archived = true;
    notesOf(p.id).forEach((n) => flash(`Arkiv\\${p.name}\\${n.file}`));
    if (currentProjectId() === p.id) { /* tab stays open, now read-only */ }
  });
}
function deleteProject(p) {
  const list = S.notes.filter((n) => n.kind === 'note' && n.project === p.id);
  const active = list.filter((n) => !n.archived).length;
  const doDelete = () => withUndo(`Projektet ${p.name} flyttat till papperskorgen`, () => {

function findOrCreateProject(name) {

  if (!p) { p = { id: newId('p'), name, expanded: true, archived: false }; S.projects.push(p); }
  return p;
}
function restoreNote(n) {
  const snap = JSON.stringify(S);
  const origin = proj(n.project);
  let target = origin;
  let recreated = false;
  if (origin.archived) { recreated = !S.projects.some((x) => !x.archived && x.name === origin.name); target = findOrCreateProject(origin.name); }
  n.archived = false;
  moveToProject(n, target.id);
  target.expanded = true;
  flash(relPath(n));
  commit();
  toast(`Återställd till ${target.name}${recreated ? ' (projektet återskapades)' : ''}`, () => { S = JSON.parse(snap); commit(); toast('Ångrat'); });
}
function restoreProject(p) {
  withUndo(`Projektet ${p.name} återställt`, () => {
    const existing = S.projects.find((x) => !x.archived && !x.inbox && x.name === p.name);
    if (existing) {
      S.notes.filter((n) => n.kind === 'note' && n.project === p.id && !n.archived).forEach((n) => moveToProject(n, existing.id));
      if (!S.notes.some((n) => n.project === p.id)) S.projects.splice(S.projects.indexOf(p), 1);
    } else {
      p.archived = false; p.expanded = true;
      S.notes.filter((n) => n.project === p.id && !n.archived).forEach((n) => flash(relPath(n)));
    }
  });
}
function deleteProjectForever(p) {

    title: `Ta bort ${esc(p.name)} från arkivet?`,

    buttons: [{ label: 'Avbryt' }, { label: 'Ta bort', cls: 'danger', act: () => withUndo(`${p.name} flyttat till papperskorgen`, () => {
      S.trash.unshift(`${ROOT}\\Arkiv\\${p.name}\\  (mapp, ${list.length} filer)`);
      list.forEach((n) => S.notes.splice(S.notes.indexOf(n), 1));

function moveNoteTo(n, pid) {

  const p = proj(pid);
  withUndo(`Flyttad till ${p.name}`, () => {
    if (n.kind !== 'note') {
      const created = fmtDT(new Date());
      const oldTitle = titleOf(n).replace(/\.(md|txt)$/i, '');
      Object.assign(n, { kind: 'note', project: pid, created, pinned: false, archived: false, file: '' });
      if (!/^#\s/.test(n.body)) n.body = `# ${oldTitle}\n\n${n.body}`;
      S.notes.splice(S.notes.indexOf(n), 1); S.notes.push(n);

let pend = null, drag = null, scrollRAF = null, lastY = 0;
function beginDrag(row, x, y) {
  const kind = row.dataset.drag;
  drag = { row, kind, id: kind === 'note' ? row.dataset.id : row.dataset.pid, sx: x, sy: y, moved: false, target: null };
  row.classList.add('dragging');

function dragMove(x, y) {

  clearMarks();
  drag.target = null;

  if (!row) return;
  const r = row.getBoundingClientRect();
  const after = y > r.top + r.height / 2;
  if (drag.kind === 'note') {
    if (row.dataset.drop === 'note') {
      if (row.dataset.id === drag.id) return;
      drag.target = { type: 'note', id: row.dataset.id, after };
      row.classList.add(after ? 'drop-after' : 'drop-before');
    } else {
      drag.target = { type: 'proj', pid: row.dataset.pid };
      row.classList.add('drop-into');
    }
  } else {
    let pr = row.dataset.drop === 'proj' ? row : null;
    if (!pr && row.dataset.pid) pr = document.querySelector(`#sb-list .row.proj[data-pid="${row.dataset.pid}"]`);
    if (!pr || pr.dataset.pid === INBOX || pr.dataset.pid === drag.id) return;
    const pr2 = pr.getBoundingClientRect();
    const aft = pr === row ? after : true;
    drag.target = { type: 'projorder', pid: pr.dataset.pid, after: aft };
    pr.classList.add(aft ? 'drop-after' : 'drop-before');
    void pr2;
  }
}
function autoScroll() {

    if (!drag) return;

    const r = list.getBoundingClientRect();

    else if (lastY && lastY > r.bottom - 36) list.scrollTop += 6;
    scrollRAF = requestAnimationFrame(tick);
  };

}
function dragEnd(cancel) {

  cancelAnimationFrame(scrollRAF);
  $('#ghost').hidden = true;
  clearMarks();
  d.row.classList.remove('dragging');
  if (cancel) return;
  if (!d.moved) { if (isTouch) openRowMenu(d.row); return; }
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 50);
  const t = d.target;
  if (!t) return;
  if (d.kind === 'note') {
    const n = doc(d.id);
    if (t.type === 'note') {
      const target = doc(t.id);
      if (target.project !== n.project) {
        withUndo(`Flyttad till ${proj(target.project).name}`, () => { moveToProject(n, target.project, target.id, t.after); flash(relPath(n)); });
      } else {
        S.notes.splice(S.notes.indexOf(n), 1);

        commit();
      }
    } else if (t.pid !== n.project) moveNoteTo(n, t.pid);
  } else {
    const p = proj(d.id);
    const target = proj(t.pid);
    S.projects.splice(S.projects.indexOf(p), 1);

}

      { label: 'Arkivera anteckningen', act: () => archiveNote(n), disabled: !n || n.kind !== 'note' || isArchived(n) },
      { sep: true },
      { label: S.rootChosen ? 'Anteckningsmapp…' : 'Välj anteckningsmapp…', act: chooseRoot },
    ],
    edit: [{ label: 'Ångra', kbd: 'Ctrl+Z', disabled: true }, { label: 'Sök', kbd: 'Ctrl+F', disabled: true }],
    view: [
      { label: 'Sidopanel', kbd: 'Ctrl+Shift+B', check: narrow() ? U.drawerOpen : U.sidebarOpen, act: toggleSidebar },
      { label: 'Sök anteckningar', kbd: 'Ctrl+Shift+F', check: false, act: openSearch, disabled: !S.rootChosen },
      { label: 'Arkiv', check: U.archiveView, act: () => { U.archiveView = !U.archiveView; if (narrow()) U.drawerOpen = true; else U.sidebarOpen = true; commit(); }, disabled: !S.rootChosen },
      { sep: true },
      { label: 'Skrivläge', kbd: 'Ctrl+Shift+W', check: U.writing, act: () => { U.writing = true; commit(); } },
    ],
    help: [{ label: 'Prova det här (mockup)', act: helpModal }],
  };
  b.classList.add('open');
  showMenu(b, menus[b.dataset.menu]);
  b.classList.add('open');
});

// Command palette
let palSel = 0;
function renderPalette() {
  const q = $('#pal-q').value;
  const r = q.trim() ? searchResults(q) : S.notes.filter((n) => n.kind === 'note' && !isArchived(n)).slice(0, 8);
  palSel = Math.min(palSel, Math.max(0, r.length - 1));
  $('#pal-list').innerHTML = (q.trim() ? '' : '<div class="mh" style="padding:6px 14px;font-size:11px;color:var(--fg-muted)">Anteckningar</div>')
    + (r.length ? r.map((n, i) => resultHtml(n, q, i === palSel)).join('') : `<div class="empty-res">Inga träffar på ”${esc(q)}”.</div>`);
  return r;
}
$('#pal-q').addEventListener('input', () => { palSel = 0; renderPalette(); });
$('#pal-q').addEventListener('keydown', (e) => {
  const r = renderPalette();
  if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, r.length - 1); renderPalette(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); renderPalette(); e.preventDefault(); }
  if (e.key === 'Enter' && r[palSel]) { $('#palette').hidden = true; openDoc(r[palSel].id); }
  if (e.key === 'Escape') $('#palette').hidden = true;
});
$('#palette').addEventListener('click', (e) => {
  const res = e.target.closest('[data-open]');
  if (res) { $('#palette').hidden = true; return openDoc(res.dataset.open); }
  if (e.target.id === 'palette') $('#palette').hidden = true;
});

// Global: close menus, keyboard shortcuts
document.addEventListener('pointerdown', (e) => {
  if (!$('#popup').hidden && !e.target.closest('#popup') && !e.target.closest('[data-act$="menu"]') && !e.target.closest('#menubar') && !e.target.closest('#mk-menu')) closeMenu();
});
function shortcut(name) {
  closeMenu();
  if (name === 'ctrl-t') return newNote(INBOX);
  if (name === 'ctrl-alt-n') return newNote(currentProjectId());
  if (name === 'ctrl-shift-b') return toggleSidebar();
  if (name === 'ctrl-shift-f') { if (!S.rootChosen) return toast('Välj en anteckningsmapp först.'); return openSearch(); }
}
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey && e.shiftKey && k === 'b') { e.preventDefault(); shortcut('ctrl-shift-b'); }
  else if (e.ctrlKey && e.shiftKey && k === 'f') { e.preventDefault(); shortcut('ctrl-shift-f'); }
  else if (e.ctrlKey && e.altKey && k === 'n') { e.preventDefault(); shortcut('ctrl-alt-n'); }
  else if (e.ctrlKey && !e.shiftKey && !e.altKey && k === 't') { e.preventDefault(); shortcut('ctrl-t'); }
  else if (e.key === 'Escape') {
    if (!$('#popup').hidden) closeMenu();
    else if ($('#modal-root').innerHTML) $('#modal-root').innerHTML = '';
    else if (!$('#palette').hidden) $('#palette').hidden = true;
    else if (U.writing) { U.writing = false; commit(); }
    else if (narrow() && U.drawerOpen) { U.drawerOpen = false; commit(); }
  }
});

// Mockup bar
$('#mockbar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-mk]');
  if (!b) return;
  const k = b.dataset.mk;
  if (k.startsWith('ctrl')) return shortcut(k);
  if (k === 'disk') { U.diskOpen = !U.diskOpen; return commit(); }
  if (k === 'help') return helpModal();
  if (k === 'menu') {
    const wasOpen = !$('#popup').hidden && menuAnchor === b;
    closeMenu();
    if (wasOpen) return;
    showMenu(b, [
      { label: 'Mörkt tema', check: U.theme === 'dark', act: () => { U.theme = U.theme === 'dark' ? 'light' : 'dark'; commit(); } },
      { label: 'Visa som desktop (1280 px)', check: U.desktop, act: () => { U.desktop = !U.desktop; commit(); } },
      { sep: true },
      { label: 'Första start (ingen mapp vald)', act: () => { S = seedFirstRun(); U = uiFirstRun(U); commit(); toast('Första start: sidopanelen är stängd tills en mapp är vald.'); } },
      { label: 'Återställ demodata', act: () => { const t = U.theme, d = U.desktop; S = seedDemo(); U = { ...uiDemo(), theme: t, desktop: d }; commit(); toast('Demodata återställd'); } },
    ]);
  }
});
window.addEventListener('resize', () => { applyLayout(); renderTabs(); });
window.addEventListener('orientationchange', () => setTimeout(applyLayout, 200));

renderAll();
if (!localStorage.getItem(STORE + '-seen')) { localStorage.setItem(STORE + '-seen', '1'); setTimeout(helpModal, 300); }
</script>
</body>
</html>
